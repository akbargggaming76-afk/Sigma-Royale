
name: Build Sigmax-Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project folder
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "package.json" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted
              unzip -oq "$ZIP_FILE" -d extracted
            fi

            PACKAGE=$(find . -type f -name package.json \
              -not -path "*/node_modules/*" | head -n 1)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json tidak ditemukan"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$(realpath "$PACKAGE")")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Prepare Capacitor config
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html tidak ditemukan"
            exit 1
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sigmaxroyale.game",
            "appName": "Sigmax-Royale",
            "webDir": "www"
          }
          EOF

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sigmax-Royale-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
